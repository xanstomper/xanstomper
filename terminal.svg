<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="100%" height="220">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="40%" stop-color="#e0f2fe"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Moving Signal Packet along wire -->
    <style>
      @keyframes pulseBeam {
        0%, 100% { transform: scaleX(0.96); opacity: 0.6; }
        50% { transform: scaleX(1.02); opacity: 1; filter: drop-shadow(0 0 12px #38bdf8); }
      }
      @keyframes travelPacket {
        0% { transform: translateX(-100px); opacity: 0; }
        15% { opacity: 1; }
        85% { opacity: 1; }
        100% { transform: translateX(1060px); opacity: 0; }
      }
      @keyframes travelPacket2 {
        0% { transform: translateX(1060px); opacity: 0; }
        15% { opacity: 1; }
        85% { opacity: 1; }
        100% { transform: translateX(-100px); opacity: 0; }
      }
      @keyframes breatheNodes {
        0%, 100% { r: 3px; opacity: 0.5; }
        50% { r: 4.5px; opacity: 1; filter: drop-shadow(0 0 6px #38bdf8); }
      }
      .beam { animation: pulseBeam 4s infinite ease-in-out; transform-origin: center; }
      .packet1 { animation: travelPacket 5s infinite cubic-bezier(0.4, 0, 0.2, 1); }
      .packet2 { animation: travelPacket2 7s infinite cubic-bezier(0.4, 0, 0.2, 1); }
      .node-pulse { animation: breatheNodes 3s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="960" height="220" rx="14" fill="url(#bgGlow)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Subtle Perspective Grid / Hardware Blueprint Lines -->
  <g stroke="#1e293b" stroke-width="0.8" opacity="0.45">
    <line x1="0" y1="40" x2="960" y2="40"/>
    <line x1="0" y1="180" x2="960" y2="180"/>
    <line x1="160" y1="0" x2="160" y2="220"/>
    <line x1="800" y1="0" x2="800" y2="220"/>
    <line x1="480" y1="0" x2="480" y2="220" stroke-dasharray="4,6" opacity="0.4"/>
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="110" r="140" fill="url(#purpleGlow)" filter="blur(40px)"/>
  <circle cx="760" cy="110" r="140" fill="url(#purpleGlow)" filter="blur(40px)"/>

  <!-- Hardware Circuit Accents -->
  <path d="M 60 110 L 140 110 L 170 80 L 320 80" stroke="#334155" stroke-width="1.2" fill="none"/>
  <path d="M 640 140 L 790 140 L 820 110 L 900 110" stroke="#334155" stroke-width="1.2" fill="none"/>

  <!-- Dynamic Glowing Beams -->
  <line x1="120" y1="110" x2="840" y2="110" stroke="url(#cyanLine)" stroke-width="1.6" class="beam"/>

  <!-- Flying Signal Packets -->
  <g class="packet1">
    <circle cx="0" cy="110" r="3.5" fill="#38bdf8" filter="drop-shadow(0 0 8px #38bdf8)"/>
    <line x1="-30" y1="110" x2="0" y2="110" stroke="#38bdf8" stroke-width="2" opacity="0.7"/>
  </g>
  <g class="packet2">
    <circle cx="0" cy="110" r="3" fill="#818cf8" filter="drop-shadow(0 0 8px #818cf8)"/>
    <line x1="0" y1="110" x2="30" y2="110" stroke="#818cf8" stroke-width="1.8" opacity="0.6"/>
  </g>

  <!-- Circuit Junction Nodes -->
  <circle cx="170" cy="80" r="3.5" fill="#38bdf8" class="node-pulse"/>
  <circle cx="820" cy="110" r="3.5" fill="#818cf8" class="node-pulse"/>
  <circle cx="140" cy="110" r="2.5" fill="#64748b"/>
  <circle cx="790" cy="140" r="2.5" fill="#64748b"/>

  <!-- Foreground Title Card -->
  <g text-anchor="middle">
    <!-- Top System Tag -->
    <text x="480" y="58" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="4">
      HARDWARE EMULATION · RUNTIMES · AUTONOMOUS SYSTEMS
    </text>

    <!-- Main Name -->
    <text x="480" y="122" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="10">
      XANSTOMPER
    </text>

    <!-- Bottom Specs Line -->
    <text x="480" y="162" fill="#94a3b8" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="12" letter-spacing="1.5">
      XBOX DEV MODE PE64  ·  SWITCH D3D12  ·  WEBGPU RAGE  ·  11ms NATIVE AGENT
    </text>
  </g>

  <!-- Corner Brackets (Precision Engineering Accents) -->
  <path d="M 20 32 L 20 20 L 32 20" stroke="#38bdf8" stroke-width="1.8" fill="none" opacity="0.8"/>
  <path d="M 940 32 L 940 20 L 928 20" stroke="#38bdf8" stroke-width="1.8" fill="none" opacity="0.8"/>
  <path d="M 20 188 L 20 200 L 32 200" stroke="#38bdf8" stroke-width="1.8" fill="none" opacity="0.8"/>
  <path d="M 940 188 L 940 200 L 928 200" stroke="#38bdf8" stroke-width="1.8" fill="none" opacity="0.8"/>
</svg>