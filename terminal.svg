<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 300" width="100%" height="300">
  <defs>
    <style>
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes glow { 0%, 100% { filter: drop-shadow(0 0 2px #10b981); } 50% { filter: drop-shadow(0 0 6px #10b981); } }
      .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; rx: 10px; }
      .bar { fill: #161b22; stroke: #30363d; stroke-width: 1; rx: 10px; }
      .dot-r { fill: #ff5f56; }
      .dot-y { fill: #ffbd2e; }
      .dot-g { fill: #27c93f; }
      .title { fill: #8b949e; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; }
      .txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13px; font-weight: 500; }
      .prm { fill: #3fb950; }
      .cmd { fill: #f0f6fc; }
      .out { fill: #58a6ff; }
      .dim { fill: #8b949e; }
      .acc { fill: #f85149; }
      .glow-green { fill: #3fb950; animation: glow 3s infinite ease-in-out; }
      .cur { fill: #3fb950; animation: blink 1s infinite; }
    </style>
  </defs>

  <!-- Terminal Window Background -->
  <rect width="850" height="300" class="bg" />
  <path d="M 0 10 C 0 4.5 4.5 0 10 0 L 840 0 C 845.5 0 850 4.5 850 10 L 850 36 L 0 36 Z" class="bar" />
  
  <!-- Window Controls -->
  <circle cx="20" cy="18" r="6" class="dot-r" />
  <circle cx="38" cy="18" r="6" class="dot-y" />
  <circle cx="56" cy="18" r="6" class="dot-g" />
  <text x="425" y="22" text-anchor="middle" class="title">xanstomper@xenon-core · persistent PTY session</text>
  
  <!-- Terminal Content -->
  <g transform="translate(24, 66)" class="txt">
    <text y="0" class="prm">xanstomper@dev:~$ <tspan class="cmd">uname -sm &amp;&amp; whoami</tspan></text>
    <text y="24" class="out">Linux x86_64 · xanstomper [systems · runtimes · emulators · agents]</text>
    
    <text y="64" class="prm">xanstomper@dev:~$ <tspan class="cmd">spydermonkey status --brief</tspan></text>
    <text y="88" class="glow-green">▶ 11,683-skill corpus active · 10 mandate engines armed · selftest 30/30 PASS</text>

    <text y="128" class="prm">xanstomper@dev:~$ <tspan class="cmd">cat /proc/active_targets</tspan></text>
    <text y="152" class="acc">[TIRAMISU: XBOX PE64]  [NEMU: SWITCH D3D12]  [MOCHI: RUST CORE]  [GROVETHEFT: WEBGPU]</text>

    <text y="192" class="prm">xanstomper@dev:~$ <tspan class="cmd">echo "no fake success. offline first."</tspan><tspan class="cur"> ▋</tspan></text>
  </g>
</svg>